name = "kinwoo"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# open-next.config.ts uses the OpenNext KV incremental cache, which looks for this
# binding. Without it OpenNext warns and silently skips incremental caching.
# Create the namespaces first:
#   wrangler kv namespace create kinwoo-cache-test
#   wrangler kv namespace create kinwoo-cache-prod
# then paste each id below.

[env.test]
name = "kinwoo-test"

[env.test.vars]
APP_HOSTNAME = "test.kinwoo.cbsdev.me"

# workers_dev and preview_urls are both off, so without a route the deployed
# Worker has no reachable hostname. cbsdev.me must be on Cloudflare DNS.
[[env.test.routes]]
pattern = "test.kinwoo.cbsdev.me"
custom_domain = true

[[env.test.kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "REPLACE_WITH_TEST_KV_NAMESPACE_ID"

[env.production]
name = "kinwoo"

[env.production.vars]
APP_HOSTNAME = "kinwoo.cbsdev.me"

[[env.production.routes]]
pattern = "kinwoo.cbsdev.me"
custom_domain = true

[[env.production.kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "REPLACE_WITH_PROD_KV_NAMESPACE_ID"
