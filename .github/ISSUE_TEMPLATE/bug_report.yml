name: Bug report
description: Something in Kinwoo isn't working as expected.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The version and device info below are what usually decide whether a bug report is answerable — the in-app "Help" link (Settings → About → Help) pre-fills both for you.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I did X, Y happened instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App version
      description: Found under Settings → About.
      placeholder: e.g. 1.2.1
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. iPhone 14, Safari 17 / Pixel 7, Chrome 128
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: Were you logged in or playing as a guest?
      options:
        - Logged in
        - Guest
        - Not sure
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, etc. Never include a password, magic-link URL, or Supabase key here.
    validations:
      required: false
