name: Bug report
description: Something in Kinwoo isn't working as expected.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: App version and device
      description: Version is under Settings → About.
      placeholder: e.g. 1.2.1, iPhone 14 Safari / Pixel 7 Chrome
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or console errors. Never include a password, magic-link URL, or Supabase key.
