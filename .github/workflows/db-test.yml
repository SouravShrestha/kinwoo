name: Database Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  db-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Restore dependencies
        run: npm ci

      # Applies every migration to an empty database, so a broken migration fails here
      # before it reaches a hosted project. Storage and auth stay on: the baseline
      # touches auth.users and storage.objects.
      - name: Start local Supabase
        run: npx supabase start -x studio,mailpit,imgproxy,edge-runtime,vector,logflare

      - name: Run pgTAP tests
        run: npx supabase test db
