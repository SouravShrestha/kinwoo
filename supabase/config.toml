project_id = "kinwoo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches outbound mail locally so OTP codes can be read without real SMTP.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "kinwoo://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Lets a signed-in user link a Google account from their profile. The hosted project needs
# "Allow manual linking" switched on in the dashboard.
enable_manual_linking = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
# 6-digit codes rather than magic links. The hosted project needs the matching
# change by hand: the Magic Link email template must contain {{ .Token }}, or
# Supabase sends a link and the code screen can never succeed.
otp_length = 6
otp_expiry = 600
# Minimum gap between OTP emails to the same address. GoTrue defaults to 60s.
max_frequency = "1s"

# Local stack only: limits are raised so repeated sign-in testing never trips
# them. The hosted project keeps its own limits, set in the dashboard.
[auth.rate_limit]
email_sent = 10000
sms_sent = 10000
anonymous_users = 10000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

[auth.sms]
enable_signup = false
enable_confirmations = false

# Local stack only. Credentials for the hosted project are set in the dashboard.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[analytics]
enabled = false

[realtime]
enabled = true

[edge_runtime]
enabled = true

# The database trigger calls this with a shared secret instead of a user JWT.
[functions.send-push]
verify_jwt = false

[storage]
enabled = true

[storage.buckets.avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.uploaded_avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg"]

[auth.email.template.confirmation]
subject = "Your Kinwoo verification code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Your Kinwoo sign-in code"
content_path = "./supabase/templates/otp.html"
